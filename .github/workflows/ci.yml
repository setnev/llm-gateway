name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit -- --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    env:
      ADMIN_API_KEY: ci-test-key-that-is-32-chars-long-ok
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:integration

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t llm-gateway:ci .

  smoke-test:
    name: Container Smoke Test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t llm-gateway:smoke .
      - name: Start container
        run: |
          docker run -d --name gw \
            -p 8080:8080 \
            -e ADMIN_API_KEY=smoke-test-admin-key-32chars-exactly \
            -e NODE_ENV=production \
            llm-gateway:smoke
      - name: Wait for server ready (max 15s)
        run: |
          for i in {1..15}; do
            if curl -sf http://localhost:8080/health >/dev/null; then
              echo "Server is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready"
          docker logs gw
          exit 1
      - name: Verify /health returns ok
        run: |
          body=$(curl -s http://localhost:8080/health)
          echo "Health response: $body"
          echo "$body" | grep -q '"status":"ok"' || { echo "Bad health body"; exit 1; }
      - name: Teardown
        if: always()
        run: docker rm -f gw || true
